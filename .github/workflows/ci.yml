name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      compat:
        description: Also install real DSH host versions and re-run the composition suite
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  check:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Typecheck, build, test
        run: npm run check

  compat:
    name: host compatibility matrix
    if: github.event_name == 'workflow_dispatch' && inputs.compat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Install real host versions and re-run the composition suite
        run: npm run compat:matrix
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compat-report
          path: reports/
          if-no-files-found: ignore
